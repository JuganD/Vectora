<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- V shape with arrows representing message flow -->
  <path d="M15 20 L50 75 L85 20" fill="none" stroke="url(#grad1)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Arrow heads for message direction -->
  <path d="M30 35 L22 30 L28 24" fill="none" stroke="url(#grad2)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M70 35 L78 30 L72 24" fill="none" stroke="url(#grad2)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Dots representing messages -->
  <circle cx="35" cy="42" r="4" fill="url(#grad2)"/>
  <circle cx="50" cy="60" r="4" fill="url(#grad1)"/>
  <circle cx="65" cy="42" r="4" fill="url(#grad2)"/>
</svg>

